# NovelCraft 自动打包 —— 云端产出便携式 Windows EXE 与 Android APK。
#
# 触发方式（二选一）：
#   1. GitHub 仓库页面 → Actions → "Build Release Packages" → Run workflow
#   2. 推送 v 开头 tag（如 v1.0.0）自动触发
#
# 产物在本次运行页面的 Artifacts 区直接下载：
#   NovelCraft-Windows-便携版.zip   （解压即用，免安装）
#   NovelCraft-Android.apk          （直装）
name: Build Release Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Windows 便携版 EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 构建 Windows Release
        run: flutter build windows --release

      - name: 打便携包（整目录解压即用）
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath NovelCraft-Windows-便携版.zip

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: NovelCraft-Windows-便携版
          path: NovelCraft-Windows-便携版.zip

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 构建 Release APK
        run: flutter build apk --release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: NovelCraft-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
